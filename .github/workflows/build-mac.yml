name: Build macOS App

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout files
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build macOS app
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --windowed \
            --name "FishingMacro" \
            --osx-bundle-identifier "com.fishingmacro.kakaotalk" \
            fishing_macro.py

      - name: Zip app bundle
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/FishingMacro.app" \
            "FishingMacro-macOS.zip"

      - name: Upload built app
        uses: actions/upload-artifact@v4
        with:
          name: FishingMacro-macOS
          path: FishingMacro-macOS.zip
          if-no-files-found: error
